<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ title or "Engineering Dashboard" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .metric-card { border: 0; border-radius: 1rem; }
    .soft-muted { color: #6c757d; }
    .progress { height: 10px; }
    .project-progress { height: 8px; }
    .stat-number { font-size: 1.6rem; font-weight: 700; }
  </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" href="/dashboard">Eng Dashboard</a>
    <div class="d-flex align-items-center gap-2">
      <a class="btn btn-sm btn-outline-light" href="/dashboard">Dashboard</a>
      <a class="btn btn-sm btn-outline-light" href="/projects">Projects</a>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm d-none" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

<script>
  window.GATEWAY_BASE = "{{ gateway_base }}";
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
