{% extends "base.html" %}
{% set title = "Projects" %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
  <div>
    <h3 class="mb-0">Projects</h3>
    <div class="text-muted small">Create and organize engineering projects.</div>
  </div>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-secondary" href="/dashboard">Back to Dashboard</a>
    <button class="btn btn-success" onclick="openCreateProject()">+ New Project</button>
  </div>
</div>

<div class="card shadow-sm mb-3 border-0">
  <div class="card-body">
    <div class="row g-2">
      <div class="col-md-4">
        <input id="projName" class="form-control" placeholder="Project name (required)">
      </div>
      <div class="col-md-4">
        <input id="projDesc" class="form-control" placeholder="Description (optional)">
      </div>
      <div class="col-md-4">
        <input id="projRepo" class="form-control" placeholder="GitHub repo: owner/repo (optional)">
      </div>
    </div>
    <div class="mt-2 d-flex gap-2 align-items-center flex-wrap">
      <button class="btn btn-primary btn-sm" onclick="createProject()">Create</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="clearProjectForm()">Clear</button>
      <span id="createProjectMsg" class="small ms-2"></span>
    </div>
  </div>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Your Projects</h5>
      <button class="btn btn-outline-primary btn-sm" onclick="loadProjects()">Refresh</button>
    </div>
    <hr/>
    <div id="projectsList" class="list-group"></div>
  </div>
</div>
{% endblock %}
