{% extends "base.html" %}
{% set title = "Login" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="card-title mb-2">Login</h4>
        <p class="text-muted">Sign in to manage projects, tasks, documents, and engineering metrics.</p>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input id="email" type="email" class="form-control" placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input id="password" type="password" class="form-control" placeholder="••••••••">
        </div>

        <div class="d-grid gap-2">
          <button class="btn btn-primary" onclick="login()">Login</button>
          <button class="btn btn-outline-secondary" onclick="registerUser()">Register (if new)</button>
        </div>

        <div id="msg" class="mt-3 small"></div>
      </div>
    </div>

    <div class="alert alert-info mt-3 border-0 shadow-sm">
      <div class="small">
        After login, you will be redirected to the <b>Dashboard</b> overview page.
      </div>
    </div>
  </div>
</div>
{% endblock %}
